<script>
  (function initSecurityKeypad() {
    let pinCode = ['8', '4'];
    const dots = document.querySelectorAll('.pin-dot');
    const statusText = document.getElementById('auth-status-text');

    function updateDots() {
      dots.forEach((dot, idx) => {
        if (idx < pinCode.length) {
          dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-primary shadow-[0_0_10px_rgba(208,188,255,0.7)] transition-all duration-200 scale-105';
        } else {
          dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-200 scale-100';
        }
      });

      if (pinCode.length === 4) {
        statusText.textContent = "Verifying cryptographic token...";
        statusText.classList.remove('text-tertiary');
        statusText.classList.add('text-secondary');
        setTimeout(() => {
          statusText.textContent = "Vault Unlocked";
          statusText.classList.remove('text-secondary');
          statusText.classList.add('text-tertiary');
        }, 600);
      } else {
        statusText.textContent = "Touch sensor or scan Face ID";
        statusText.classList.remove('text-secondary');
        statusText.classList.add('text-tertiary');
      }
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (pinCode.length < 4) {
          pinCode.push(btn.getAttribute('data-val'));
          updateDots();
        }
      });
    });

    const backspaceBtn = document.getElementById('backspace-btn');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (pinCode.length > 0) {
          pinCode.pop();
          updateDots();
        }
      });
    }

    const faceIdBtn = document.getElementById('faceid-btn');
    const biometricTrigger = document.getElementById('biometric-trigger');
    
    function triggerBiometricFeedback() {
      statusText.textContent = "Biometric Match Verified";
      pinCode = ['1', '2', '3', '4'];
      updateDots();
    }

    if (faceIdBtn) faceIdBtn.addEventListener('click', triggerBiometricFeedback);
    if (biometricTrigger) biometricTrigger.addEventListener('click', triggerBiometricFeedback);
  })();
</script></main></body></html>
